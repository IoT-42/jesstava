apiVersion: apps/v1
kind: Deployment
metadata:
  name: jesstava-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jesstava-playground
  template:
    metadata:
      labels:
        app: jesstava-playground
    spec:
      containers:
      - name: playground
        image: wil42/playground:v1
        ports:
        - containerPort: 8888
